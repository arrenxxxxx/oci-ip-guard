name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m unittest discover -s tests -v
      - run: sh -n ip-guard && ./ip-guard --help
      - run: |
          cp deploy/controller/.env.example deploy/controller/.env
          docker compose -f deploy/controller/compose.yaml config --quiet
      - if: matrix.python == '3.12'
        run: |
          docker build --target controller -t ip-guard-controller:test .
